server:
  port: 8082
  error:
    include-message: always
    include-stacktrace: never

spring:
  mvc:
    problemdetails:
      enabled: true
  application:
    name: servico-recurso
  data:
    mongodb:
      uri: mongodb://localhost:27018/bd_recurso

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
