server:
  port: 8084
  error:
    include-message: always
    include-stacktrace: never

spring:
  mvc:
    problemdetails:
      enabled: true
  application:
    name: servico-auth
  datasource:
    url: jdbc:postgresql://localhost:5433/bd_auth
    username: reservas
    password: reservas
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  # HS256 exige uma chave de no minimo 256 bits (32 caracteres) - mesma chave deve estar
  # configurada no servico-reserva para que a assinatura do token possa ser validada la.
  secret: "tp1-tp3-sistema-de-reservas-chave-secreta-compartilhada-servico-auth-servico-reserva"
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 86400000
