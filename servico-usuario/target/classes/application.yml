server:
  port: 8081
  error:
    include-message: always
    include-stacktrace: never

spring:
  mvc:
    problemdetails:
      enabled: true
  application:
    name: servico-usuario
  datasource:
    url: jdbc:postgresql://localhost:5433/bd_usuario
    username: reservas
    password: reservas
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
