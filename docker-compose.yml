services:
  postgres:
    image: postgres:16
    container_name: reservas-postgres
    environment:
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
      - ./docker/inicializacao-postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservas"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: reservas-mongo
    environment:
      MONGO_INITDB_DATABASE: bd_recurso
    ports:
      - "27018:27017"
    volumes:
      - dados_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados_postgres:
  dados_mongo:
