server:
  port: 8083
  error:
    include-message: always
    include-stacktrace: never

spring:
  mvc:
    problemdetails:
      enabled: true
  application:
    name: servico-reserva
  datasource:
    url: jdbc:postgresql://localhost:5433/bd_reserva
    username: reservas
    password: reservas
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,retries
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      servicoRecurso:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.reservas.servicoreserva.exception.RecursoNaoEncontradoException
  retry:
    instances:
      servicoUsuario:
        max-attempts: 3
        wait-duration: 500ms
        ignore-exceptions:
          - com.reservas.servicoreserva.exception.UsuarioNaoEncontradoException

logging:
  level:
    io.github.resilience4j: INFO
