server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: rota-usuario
              uri: lb://servico-usuario
              predicates:
                - Path=/api/usuarios/**
              filters:
                - StripPrefix=1
            - id: rota-recurso
              uri: lb://servico-recurso
              predicates:
                - Path=/api/recursos/**
              filters:
                - StripPrefix=1
            - id: rota-reserva
              uri: lb://servico-reserva
              predicates:
                - Path=/api/reservas/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
